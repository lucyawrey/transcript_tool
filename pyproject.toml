[project]
name = "transcript_tool"
version = "0.1.0"
description = "A quick python script made for bulk transcribing audio files off of my audio recorder."
authors = [
    {name = "Lucy Awrey",email = "35198881+lucyawrey@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)",
    "transcribe-cpp (==0.4.1)",
    "llama-cpp-python (==0.3.36)"
]

[dependency-groups]
dev = ["pytest (>=8)"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
llama-cpp-python = [
    {version = "0.3.36", source = "llama-cpp-vulkan", markers = "sys_platform == 'linux'"},
    {version = "0.3.36", source = "PyPI", markers = "sys_platform != 'linux'"},
]

[[tool.poetry.source]]
name = "llama-cpp-vulkan"
url = "https://abetlen.github.io/llama-cpp-python/whl/vulkan"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
